<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0e1a"/>
      <stop offset="100%" stop-color="#131629"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer rounded square with gradient -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Inner dark panel -->
  <rect x="40" y="40" width="432" height="432" rx="80" ry="80" fill="url(#innerGrad)" opacity="0.85"/>

  <!-- Letter T with glow -->
  <text x="256" y="300" text-anchor="middle" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="260" fill="url(#bgGrad)" filter="url(#glow)">T</text>

  <!-- Checkmark accent -->
  <g filter="url(#softGlow)">
    <polyline points="320,180 355,215 410,145" fill="none" stroke="#00e5ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Subtle corner dots for cosmic feel -->
  <circle cx="100" cy="100" r="4" fill="#7c4dff" opacity="0.5"/>
  <circle cx="412" cy="100" r="3" fill="#00e5ff" opacity="0.4"/>
  <circle cx="100" cy="412" r="3" fill="#00e5ff" opacity="0.4"/>
  <circle cx="412" cy="412" r="4" fill="#7c4dff" opacity="0.5"/>
</svg>
