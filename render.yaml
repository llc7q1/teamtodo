databases:
  - name: teamtodo-db
    plan: free
    databaseName: teamtodo
    user: teamtodo

services:
  # 后端 API
  - type: web
    name: teamtodo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teamtodo-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://teamtodo-frontend.onrender.com

  # 前端静态网站
  - type: web
    name: teamtodo-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://teamtodo-api.onrender.com/api
